name: Build Procreate test workspace

on:
  push:
    branches: [procreate-test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: procreate-test-workspace
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PlatformIO
        run: python -m pip install 'platformio==6.2.0'
      - name: Build firmware and release images
        run: pio run -e navio_chron -e ble_test -e ble_diag -e debug_boot -e led_beacon
      - name: Test firmware host logic
        run: pio test -e native_test
      - name: Test Web flasher rules and protocol
        run: |
          node tools/probe/webflash_rules_test.js
          node tools/probe/navio_proto_test.js
          node editor/preset_test.js
          node editor/library_test.js
          node editor/device_test.js
          node editor/ble_bonds_test.js
          node editor/templates_test.js
          node editor/template_browser_test.js
          node editor/import_export_test.js
          node editor/rgb_preview_test.js
      - name: Assemble test workspace
        run: |
          release_dir=$(find release -mindepth 1 -maxdepth 1 -type d -name 'navio_chron_*' -print -quit)
          test -n "$release_dir"
          workspace=_site/testing/procreate
          mkdir -p "$workspace/firmware"
          cp -r editor/. "$workspace/"
          rm -f "$workspace"/*_test.js
          rm "$workspace/redirect.html"
          cp tools/probe/webunified_probe.html "$workspace/firmware/index.html"
          cp tools/probe/navio_proto.js tools/probe/webflash_rules.js "$workspace/"
          cp tools/probe/navio_proto.js tools/probe/webflash_rules.js tools/probe/esptool-js.bundle.js tools/probe/esptool-js.LICENSE "$workspace/firmware/"
          sed -i 's#\.\./tools/probe/navio_proto\.js#navio_proto.js#; s#\.\./tools/probe/webflash_rules\.js#webflash_rules.js#' "$workspace/index.html"
          cp "$release_dir/manifest.json" "$release_dir"/*.bin "$workspace/"
          sed -i 's#value="/release/[^"]*/manifest.json"#value="../manifest.json"#; s#\.\./\.\./editor/styles\.css#../styles.css#' "$workspace/firmware/index.html"
      - uses: actions/upload-artifact@v4
        with:
          name: procreate-test-workspace
          path: _site/testing/procreate
          retention-days: 14
