name: Build and deploy Navio Web flasher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PlatformIO
        run: python -m pip install 'platformio==6.2.0'
      - name: Build firmware and release images
        run: |
          pio run -e navio_chron
          python tools/make_release.py
      - name: Test Web flasher rules and protocol
        run: |
          node tools/probe/webflash_rules_test.js
          node tools/probe/navio_proto_test.js
          node editor/preset_test.js
          node editor/library_test.js
      - name: Assemble static site
        run: |
          release_dir=$(find release -mindepth 1 -maxdepth 1 -type d -name 'navio_chron_*' -print -quit)
          test -n "$release_dir"
          mkdir _site
          cp tools/probe/webunified_probe.html _site/index.html
          cp tools/probe/navio_proto.js tools/probe/webflash_rules.js _site/
          cp tools/probe/esptool-js.bundle.js tools/probe/esptool-js.LICENSE _site/
          cp -r editor _site/editor
          cp "$release_dir/manifest.json" _site/
          cp "$release_dir"/*.bin _site/
          sed -i 's#value="/release/[^"]*/manifest.json"#value="./manifest.json"#' _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
