; Navio Chron firmware — ESP32-S3 SuperMini (ESP32-S3FH4R2: 4MB QIO flash + 2MB PSRAM)
; 硬件引脚定义见 docs/hardware/HARDWARE_NOTES.md
[env:navio_chron]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino

; 4MB flash, QIO, 内嵌 2MB PSRAM (quad)
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_build.partitions = default.csv

; S3 原生 USB (TinyUSB)：HID + CDC 调试串口
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DNAVIO_CHRON_FW_VERSION=\"0.1.0-dev\"

monitor_speed = 115200

lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
