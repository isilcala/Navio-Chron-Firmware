; Navio Chron firmware — ESP32-S3 SuperMini (ESP32-S3FH4R2: 4MB QIO flash + 2MB PSRAM)
; 硬件引脚定义见 docs/hardware/HARDWARE_NOTES.md
[platformio]
default_envs = navio_chron

[env:navio_chron]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino

; 4MB flash (QIO) + 内嵌 2MB PSRAM (Quad/QSPI；参照 FH4R2 参考工程，本固件未启用 PSRAM)
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_build.partitions = default.csv

; S3 原生 USB (TinyUSB)：HID + CDC 调试串口
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DNAVIO_CHRON_FW_VERSION=\"0.1.0-dev\"
build_src_filter = +<*> -<debug_boot.cpp> -<led_beacon.cpp>

monitor_speed = 115200

; 无外部库依赖：WS2812 驱动为自研（src/led/Ws2812.h）

; 诊断环境：硬件 USB-Serial/JTAG 控制台（非 TinyUSB），启动分步日志 + 输入事件打印。
; 不链接 HID 传输；崩溃时 panic 背栈仍可见；esptool 自动复位可用。
[env:debug_boot]
extends = env:navio_chron
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*> -<main.cpp> -<led_beacon.cpp> -<hid/UsbTransport.cpp> +<debug_boot.cpp>

; 启动信标：板载 RGB(GPIO48) 颜色指示启动进度，无串口依赖（未焊接阶段的 DEBUG 手段）
[env:led_beacon]
extends = env:navio_chron
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=0
build_src_filter = +<*> -<main.cpp> -<debug_boot.cpp> -<hid/UsbTransport.cpp> +<led_beacon.cpp>
