; Navio Chron firmware — ESP32-S3 SuperMini (ESP32-S3FH4R2: 4MB QIO flash + 2MB PSRAM)
; 硬件引脚定义见 docs/hardware/HARDWARE_NOTES.md；决策见 docs/DECISIONS.md
[platformio]
default_envs = navio_chron

; —— 主环境：官方 espressif32 8.0.0 = Arduino core 3.12.x (IDF 5) ——
; 选型理由见 D10：NimBLE 2.x（BLE 阶段）要求 core 3.x；Adafruit_NeoPixel 在此组合可用
[env:navio_chron]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino

; 4MB flash (QIO) + 内嵌 2MB PSRAM (Quad/QSPI，本固件未启用 PSRAM)
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_build.partitions = default.csv

; S3 原生 USB (TinyUSB)：HID + CDC 调试串口；CDC+HID 复合在 core 2.x 曾失联（D9），
; core 3.x 理论已修复，但迁移验证期间保持关闭，全绿后单独做对照实验
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DNAVIO_CHRON_FW_VERSION=\"0.2.0-dev-core3\"
build_src_filter = +<*> -<debug_boot.cpp> -<led_beacon.cpp>
extra_scripts = pre:tools/add_fs_include.py  ; core 3.x USB 库需 FS 头路径，须在库环境克隆前注入

lib_deps =
    adafruit/Adafruit NeoPixel@1.15.5

monitor_speed = 115200

; —— 回退环境：core 2.x（自研 Ws2812 驱动，Adafruit 在此组合死锁见 D8）——
; 验证 core 3.x 全绿后删除
[env:navio_chron_core2]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_build.partitions = default.csv

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DNAVIO_CHRON_FW_VERSION=\"0.1.0-dev-core2\"
build_src_filter = +<*> -<debug_boot.cpp> -<led_beacon.cpp>

; —— 诊断工具（留在 core 2.x，经硬件 USB-Serial/JTAG 出日志）——
[env:debug_boot]
extends = env:navio_chron_core2
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*> -<main.cpp> -<led_beacon.cpp> -<hid/UsbTransport.cpp> +<debug_boot.cpp>

; 启动信标：板载 RGB(GPIO48) 颜色指示启动进度，无串口依赖（未焊接阶段的 DEBUG 手段）
[env:led_beacon]
extends = env:navio_chron_core2
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=0
build_src_filter = +<*> -<main.cpp> -<debug_boot.cpp> -<hid/UsbTransport.cpp> +<led_beacon.cpp>
