; Navio Chron firmware — ESP32-S3 SuperMini (ESP32-S3FH4R2: 4MB QIO flash + 2MB PSRAM)
; 硬件引脚定义见 docs/hardware/HARDWARE_NOTES.md；决策见 docs/DECISIONS.md（D10/D11）
[platformio]
default_envs = navio_chron

; —— 主环境：core 2.0.17 + NimBLE 1.4.x（社区成熟的 BLE HID 黄金组合）——
; core 3.12 (espressif32 8.0.0, 2026-10-19) 的 NimBLE 适配层实测不可用：
; 2.5.1 连接稳但报告不被主机解释；2.3.8 连接不稳；HijelHID 成熟库原样也无法运行
[env:navio_chron]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_build.partitions = default.csv

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DNAVIO_CHRON_FW_VERSION=\"0.3.0-dev\"
build_src_filter = +<*> -<debug_boot.cpp> -<led_beacon.cpp>

lib_deps =
    h2zero/NimBLE-Arduino@1.4.3

monitor_speed = 115200

; BLE bring-up 试验构建：无视 USB 强制 BLE 路径（未焊接无电池阶段的配对/重连验证）。
; 忽略矩阵（未焊接悬空噪声会风暴式触发事件，淹没真实输入）
[env:ble_test]
extends = env:navio_chron
build_flags =
    ${env:navio_chron.build_flags}
    -DNAVIO_FORCE_BLE=1
    -DNAVIO_IGNORE_MATRIX=1
    -DNAVIO_CHRON_FW_VERSION=\"0.3.0-ble-test\"

; BLE 诊断构建：USB 外设让给硬件 JTAG 串口出实时日志（CCCD 订阅/连接事件），
; BLE 照常工作，PC 端用串口监视器观察。忽略矩阵（同 ble_test）
[env:ble_diag]
extends = env:navio_chron
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DNAVIO_FORCE_BLE=1
    -DNAVIO_IGNORE_MATRIX=1
    -DNAVIO_CHRON_FW_VERSION=\"0.3.0-ble-diag\"

; —— 诊断工具：硬件 USB-Serial/JTAG 控制台（core 2.x），分步日志 + 输入事件打印 ——
[env:debug_boot]
extends = env:navio_chron
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*> -<main.cpp> -<led_beacon.cpp> -<hid/UsbTransport.cpp> -<hid/BleTransport.cpp> +<debug_boot.cpp>

; 启动信标：板载 RGB(GPIO48) 颜色指示启动进度，无串口依赖（未焊接阶段的 DEBUG 手段）
[env:led_beacon]
extends = env:navio_chron
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=0
build_src_filter = +<*> -<main.cpp> -<debug_boot.cpp> -<hid/UsbTransport.cpp> -<hid/BleTransport.cpp> +<led_beacon.cpp>

