; Navio Chron firmware — ESP32-S3 SuperMini (ESP32-S3FH4R2: 4MB QIO flash + 2MB PSRAM)
; 硬件引脚定义见 docs/hardware/HARDWARE_NOTES.md；决策见 docs/DECISIONS.md
[platformio]
default_envs = navio_chron

; —— 主环境：官方 espressif32 8.0.0 = Arduino core 3.12.x (IDF 5) ——
; （D10/D12：core 3.12 + NimBLE 2.5.1 实测可用；此前"环境问题"结论系 pressChord bug 误判）
[env:navio_chron]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_build.partitions = default.csv

build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCFG_TUSB_CONFIG_FILE=\"navio_tusb_config.h\"
    -DNAVIO_CHRON_FW_VERSION=\"0.5.11\"
build_src_filter = +<*> -<debug_boot.cpp> -<led_beacon.cpp>
extra_scripts = pre:tools/add_fs_include.py  ; core 3.x USB 库需 FS 头路径（见脚本注释）

lib_deps =
    adafruit/Adafruit NeoPixel@1.15.5
    adafruit/Adafruit TinyUSB Library@3.7.7
    h2zero/NimBLE-Arduino@2.5.1

monitor_speed = 115200

; BLE bring-up 构建：强制 BLE 路径 + 忽略矩阵（未焊接悬空噪声会淹没真实输入）
[env:ble_test]
extends = env:navio_chron
build_flags =
    ${env:navio_chron.build_flags}
    -DNAVIO_FORCE_BLE=1
    -DNAVIO_IGNORE_MATRIX=1
    -DNAVIO_CHRON_FW_VERSION=\"0.3.0-ble-test\"

; BLE 诊断构建：USB 外设让给硬件 JTAG 串口出实时 BLE 日志（见 UsbTransport 前言）
[env:ble_diag]
extends = env:navio_chron
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DNAVIO_FORCE_BLE=1
    -DNAVIO_IGNORE_MATRIX=1
    -DNAVIO_CHRON_FW_VERSION=\"0.3.0-ble-diag\"

; 诊断固件：分步初始化日志 + 输入事件打印（硬件 USB-Serial/JTAG 控制台）
[env:debug_boot]
extends = env:navio_chron
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DNAVIO_CHRON_FW_VERSION=\"0.3.0-debug-boot\"
build_src_filter = +<*> -<main.cpp> -<led_beacon.cpp> -<hid/UsbTransport.cpp> -<hid/BleTransport.cpp> -<proto/*> +<debug_boot.cpp>

; 启动信标：板载 RGB(GPIO48) 颜色指示启动进度，无串口依赖
[env:led_beacon]
extends = env:navio_chron
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DNAVIO_CHRON_FW_VERSION=\"0.3.0-led-beacon\"
build_src_filter = +<*> -<main.cpp> -<debug_boot.cpp> -<hid/UsbTransport.cpp> -<hid/BleTransport.cpp> -<proto/*> +<led_beacon.cpp>
